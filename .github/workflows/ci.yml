name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El nombre del job ("verificar") es el check obligatorio en la regla de main.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Los pasos de npm se activan solos cuando exista package-lock.json en la raíz.
      - name: Instalar dependencias
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('package-lock.json') != ''
        run: npm run lint --if-present
      - name: Typecheck
        if: hashFiles('package-lock.json') != ''
        run: npm run typecheck --if-present
      - name: Pruebas
        if: hashFiles('package-lock.json') != ''
        run: npm run test --if-present
      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: npm run build --if-present
      - name: Dependencias sin vulnerabilidades altas
        if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high

      - name: docker-compose.yml válido
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose --env-file .env.example config --quiet
